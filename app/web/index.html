<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --panel-2:#1c232c; --line:#262e39;
    --ink:#e8edf3; --dim:#93a1b1; --faint:#66748a;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#4c8dff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;}
  header{padding:26px 32px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(15,18,22,.92);backdrop-filter:blur(8px);z-index:5}
  h1{margin:0;font-size:17px;letter-spacing:.02em}
  h1 span{color:var(--faint);font-weight:400}
  form{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  input{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);padding:11px 14px;border-radius:9px;font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,141,255,.15)}
  input::placeholder{color:var(--faint)}
  #loc,#notes{flex:0 0 180px;min-width:150px}
  button{background:var(--accent);border:0;color:#fff;padding:11px 22px;border-radius:9px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  button:hover{background:#3b7ef0}
  button:disabled{opacity:.5;cursor:default}
  .picks{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .picks b{color:var(--faint);font-weight:400;font-size:12.5px;margin-right:2px}
  .pick{background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
    font-size:12.5px;padding:4px 10px;border-radius:20px;cursor:pointer}
  .pick:hover{border-color:var(--accent);color:var(--ink)}
  main{padding:26px 32px 80px;max-width:1000px}
  .msg{color:var(--dim);padding:40px 0}
  .msg.err{color:var(--bad)}
  .dots::after{content:'';animation:dots 1.2s steps(4,end) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  .name{font-size:30px;font-weight:650;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--dim);font-family:var(--mono);font-size:13.5px}
  .sub a{color:var(--accent);text-decoration:none}
  .sub a:hover{text-decoration:underline}
  .dead{color:var(--bad)}
  .banner{margin:20px 0;padding:14px 16px;border-radius:10px;
    background:rgba(210,153,34,.09);border:1px solid rgba(210,153,34,.35)}
  .banner b{color:var(--warn);display:block;margin-bottom:5px;font-size:13.5px}
  .banner li{color:var(--dim);font-size:13.5px}
  .banner ul{margin:0;padding-left:18px}
  section{margin-top:30px}
  h2{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    margin:0 0 12px;font-weight:600}
  .fact{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:14px 16px;margin-bottom:10px}
  .fact-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .badge{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;
    padding:3px 9px;border-radius:5px}
  .verified{background:rgba(63,185,80,.14);color:var(--ok)}
  .unverified{background:rgba(210,153,34,.14);color:var(--warn)}
  .conflict{background:rgba(248,81,73,.14);color:var(--bad)}
  .label{color:var(--dim);font-size:13px;min-width:62px}
  .val{font-weight:600;font-size:15.5px}
  .meter{height:3px;background:var(--panel-2);border-radius:2px;margin:11px 0 0;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:2px}
  .srcs{margin-top:10px;display:flex;flex-direction:column;gap:4px}
  .srcs a,.srcs span{color:var(--faint);font-size:12px;font-family:var(--mono);
    text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcs a:hover{color:var(--accent)}
  .cand{display:flex;gap:10px;font-size:13.5px;margin-top:7px}
  .cand b{color:var(--warn);font-weight:600;min-width:100px;font-family:var(--mono);font-size:12.5px}
  .grid{display:grid;grid-template-columns:110px 1fr;gap:9px 16px;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px}
  .grid dt{color:var(--faint);font-size:12.5px}
  .grid dd{margin:0;font-size:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    padding:3px 9px;font-size:12.5px;color:var(--dim)}
  .shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .shots img{height:84px;border-radius:8px;border:1px solid var(--line);flex:0 0 auto}
  ul.plain{margin:0;padding-left:19px;color:var(--dim)}
  ul.plain li{margin-bottom:6px;font-size:14px}
  .ask li{color:var(--ink)}
  footer{color:var(--faint);font-size:12.5px;margin-top:34px;font-family:var(--mono)}
</style>

<header>
  <h1>Workbench <span>— research one business before you walk in</span></h1>
  <form id="f">
    <input id="q" placeholder="Company name or website — e.g. Hutchins BBQ, or craftwaykitchen.com" autofocus>
    <input id="loc" placeholder="City, ST (optional)">
    <input id="notes" placeholder="What you know (optional)">
    <button id="go">Research</button>
  </form>
  <div class="picks" id="picks"><b>try:</b></div>
</header>

<main id="out"><div class="msg">Enter a company name or a URL to build a brief.</div></main>

<script>
const EXAMPLES = [
  ["Hutchins BBQ",""], ["craftwaykitchen.com",""],
  ["Ryno Lawn Care","Frisco, TX"], ["The Heritage Table","Frisco, TX"],
  ["JS Lawn Care Service","Frisco, TX"], ["Starbucks","Frisco, TX"],
  ["Zzqqx Nonexistent Business","Frisco, TX"],
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const picks = $("#picks");
for (const [q, loc] of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pick"; b.textContent = q;
  b.onclick = () => { $("#q").value = q; $("#loc").value = loc; $("#f").requestSubmit(); };
  picks.appendChild(b);
}

$("#f").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  $("#go").disabled = true;
  $("#out").innerHTML = `<div class="msg dots">Reading their site and checking directories</div>`;
  try {
    const p = new URLSearchParams({q, location: $("#loc").value, notes: $("#notes").value});
    const res = await fetch("/api/brief?" + p);
    const data = await res.json();
    $("#out").innerHTML = data.error ? `<div class="msg err">${esc(data.error)}</div>` : render(data);
  } catch (err) {
    $("#out").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
  }
  $("#go").disabled = false;
};

const COLOR = {verified:"var(--ok)", unverified:"var(--warn)", conflict:"var(--bad)"};

function fact(f) {
  // A conflict has no single value — showing one would be picking a winner the
  // evidence does not support, so name each source and what it claimed.
  const body = f.confidence === "conflict"
    ? `<div style="margin-top:9px">${f.candidates.map(c =>
        `<div class="cand"><b>${esc(c.source_type)}</b><span>${esc(c.value)}</span></div>`).join("")}</div>`
    : `<div class="srcs">${f.sources.map(s =>
        s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_type)} · ${esc(s.source_url)}</a>`
                     : `<span>${esc(s.source_type)}</span>`).join("")}</div>`;
  return `<div class="fact">
    <div class="fact-top">
      <span class="badge ${f.confidence}">${f.confidence}</span>
      <span class="label">${esc(f.label)}</span>
      ${f.confidence === "conflict"
        ? `<span class="val" style="color:var(--bad)">sources disagree</span>`
        : `<span class="val">${esc(f.value)}</span>`}
      <span style="margin-left:auto;color:var(--faint);font-size:12px;font-family:var(--mono)">${f.score}%</span>
    </div>
    <div class="meter"><i style="width:${f.score}%;background:${COLOR[f.confidence]}"></i></div>
    ${body}</div>`;
}

function row(term, html) { return html ? `<dt>${term}</dt><dd>${html}</dd>` : ""; }

function published(p) {
  if (!p) return "";
  const chips = a => `<div class="chips">${a.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>`;
  const inner = [
    row("tagline", p.tagline ? esc(p.tagline) : ""),
    row("services", p.services.length ? chips(p.services) : ""),
    row("sells", p.products.length ? chips(p.products) : ""),
    row("hours", p.hours.length ? p.hours.map(esc).join("<br>") : ""),
    row("pricing", p.menu_items.length
        ? `${p.menu_items.length} priced item${p.menu_items.length === 1 ? "" : "s"} — `
          + esc(p.menu_items.slice(0,3).map(i => i.name + (i.price ? ` ${i.price}` : "")).join(" · ")) : ""),
    row("menu doc", p.menu_media.length ? chips(p.menu_media.map(m => m.kind)) : ""),
    row("social", p.socials.length ? chips(p.socials.map(s => s.name)) : ""),
    row("email", p.emails.length ? chips(p.emails) : ""),
  ].join("");
  const shots = p.photos.length
    ? `<section><h2>Photos on their site</h2><div class="shots">${
        p.photos.map(u => `<img src="${esc(u)}" loading="lazy" onerror="this.remove()">`).join("")}</div></section>` : "";
  return (inner ? `<section><h2>What their site publishes</h2><dl class="grid">${inner}</dl></section>` : "") + shots;
}

function list(title, items, cls) {
  if (!items.length) return "";
  return `<section><h2>${title}</h2><ul class="plain ${cls || ""}">${
    items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></section>`;
}

function render(d) {
  const site = d.website_url
    ? `<a href="${esc(d.website_url)}" target="_blank" rel="noopener">${esc(d.website_url)}</a>`
      + (d.site_reachable === false ? ` <span class="dead">— not loading</span>` : "")
    : `<span class="dead">no website found</span>`;
  const chain = d.chain_signals.length ? `<div class="banner">
      <b>MULTIPLE LOCATIONS — a franchise is not a lead, but a local group may be a better one</b>
      <ul>${d.chain_signals.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : "";
  const facts = d.facts.length
    ? `<section><h2>What we established</h2>${d.facts.map(fact).join("")}</section>`
    : `<section><h2>What we established</h2><div class="msg">Nothing corroborated — see the open questions.</div></section>`;
  return `<h1 class="name">${esc(d.name)}</h1>
    <div class="sub">${esc(d.location || "")}</div>
    <div class="sub">${site}</div>
    ${chain}${facts}${published(d.published)}
    ${list("Ask them", d.open_questions, "ask")}
    ${list("Assumptions — correct these if wrong", d.assumptions)}
    <footer>sources consulted: ${d.sources_consulted.map(esc).join(", ") || "none"}</footer>`;
}
</script>
