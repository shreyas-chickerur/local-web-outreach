<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Warm slate rather than pure grey: long sessions on a cold blue-black
       screen are tiring, and the accent has to stay readable on it. */
    --bg:#14161a; --raise:#1a1d23; --card:#1e222a; --line:#2b313b;
    --line-soft:#232830;
    --ink:#eceff4; --dim:#a8b2c1; --faint:#6f7b8c;
    --ok:#5ec98a; --ok-bg:rgba(94,201,138,.10);
    --warn:#e0b062; --warn-bg:rgba(224,176,98,.10);
    --bad:#ef7d78; --bad-bg:rgba(239,125,120,.10);
    --accent:#7aa2f7; --accent-2:#a78bfa;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:14px; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  /* A quiet wash of colour so the page is not a flat grey rectangle. */
  body::before{content:'';position:fixed;inset:0 0 auto;height:340px;z-index:0;
    background:radial-gradient(900px 300px at 18% -60px,rgba(122,162,247,.16),transparent 70%),
               radial-gradient(700px 260px at 82% -80px,rgba(167,139,250,.12),transparent 70%);
    pointer-events:none}

  header{position:sticky;top:0;z-index:10;padding:22px 34px 18px;
    border-bottom:1px solid var(--line-soft);
    background:rgba(20,22,26,.82);backdrop-filter:blur(14px) saturate(140%)}
  .brand{display:flex;align-items:baseline;gap:11px}
  .brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 12px var(--accent);align-self:center}
  .brand p{margin:0;color:var(--faint);font-size:13px}
  form{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
  .field{position:relative;flex:1;min-width:230px}
  .field.small{flex:0 0 172px;min-width:140px}
  input{width:100%;background:var(--raise);border:1px solid var(--line);
    color:var(--ink);padding:12px 15px;border-radius:11px;font:inherit;
    transition:border-color .18s,box-shadow .18s,background .18s}
  input:hover{border-color:#39414e}
  input:focus{outline:none;background:var(--card);border-color:var(--accent);
    box-shadow:0 0 0 3.5px rgba(122,162,247,.16)}
  input::placeholder{color:var(--faint)}
  button.go{background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:0;color:#0d1017;padding:12px 26px;border-radius:11px;font:inherit;
    font-weight:650;cursor:pointer;transition:transform .14s,filter .18s,opacity .18s}
  button.go:hover{filter:brightness(1.08)}
  button.go:active{transform:scale(.975)}
  button.go:disabled{opacity:.45;cursor:default;filter:none}
  .picks{margin-top:11px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .picks b{color:var(--faint);font-weight:400;font-size:12px;letter-spacing:.03em}
  .pick{background:transparent;border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12.5px;padding:4px 11px;border-radius:99px;cursor:pointer;
    transition:all .16s}
  .pick:hover{border-color:var(--accent);color:var(--ink);background:rgba(122,162,247,.09)}
  .pick[aria-pressed=true]{border-color:var(--accent);color:var(--ink);
    background:rgba(122,162,247,.16)}

  main{position:relative;z-index:1;padding:30px 34px 90px;max-width:1080px;margin:0 auto}
  .empty{text-align:center;padding:76px 20px;color:var(--faint)}
  .empty svg{opacity:.5;margin-bottom:14px}
  .empty h3{color:var(--dim);font-weight:550;margin:0 0 6px;font-size:16px}
  .empty p{margin:0;font-size:13.5px;max-width:400px;margin-inline:auto}
  .err{background:var(--bad-bg);border:1px solid rgba(239,125,120,.3);
    color:var(--bad);padding:16px 18px;border-radius:var(--r)}

  /* Loading: the lookup takes seconds, so show what it is doing. */
  .load{padding:44px 4px;max-width:440px}
  .step{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:14px;
    padding:7px 0;opacity:.35;animation:step-in .4s ease forwards}
  .step:nth-child(1){animation-delay:.05s}.step:nth-child(2){animation-delay:1.1s}
  .step:nth-child(3){animation-delay:2.4s}.step:nth-child(4){animation-delay:4s}
  @keyframes step-in{to{opacity:1;color:var(--dim)}}
  .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  .in{animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  .hero{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;
    padding-bottom:22px;border-bottom:1px solid var(--line-soft)}
  .hero h2{margin:0 0 7px;font-size:32px;font-weight:680;letter-spacing:-.025em;
    line-height:1.15}
  .hero .meta{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
  .hero .meta span{color:var(--dim)}
  .hero a{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:13px}
  .hero a:hover{text-decoration:underline}
  .none{color:var(--bad)}
  .warnish{color:var(--warn)}
  .scorecard{margin-left:auto;display:flex;gap:8px}
  .score{background:var(--raise);border:1px solid var(--line);border-radius:12px;
    padding:9px 14px;text-align:center;min-width:66px}
  .score b{display:block;font-size:21px;font-weight:680;line-height:1.2}
  .score span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

  .banner{margin:22px 0 0;padding:15px 17px;border-radius:var(--r);
    background:var(--warn-bg);border:1px solid rgba(224,176,98,.28)}
  .banner b{color:var(--warn);display:block;margin-bottom:6px;font-size:13.5px;font-weight:600}
  .banner ul{margin:0;padding-left:19px;color:var(--dim);font-size:13.5px}

  section{margin-top:34px}
  h3.head{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:10px}
  h3.head::after{content:'';flex:1;height:1px;background:var(--line-soft)}

  .facts{display:grid;gap:11px}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    transition:border-color .18s,transform .18s}
  .fact:hover{border-color:#39414e;transform:translateY(-1px)}
  .fact::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
  .fact.verified::before{background:var(--ok)}
  .fact.unverified::before{background:var(--warn)}
  .fact.conflict::before{background:var(--bad)}
  /* Field name first: you should know what you are reading before you judge it. */
  .fname{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin-bottom:5px}
  .fval{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35;
    display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .fval.disputed{color:var(--bad);font-size:16px}
  .badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
    padding:3px 8px;border-radius:6px;white-space:nowrap}
  .verified .badge{background:var(--ok-bg);color:var(--ok)}
  .unverified .badge{background:var(--warn-bg);color:var(--warn)}
  .conflict .badge{background:var(--bad-bg);color:var(--bad)}
  .pct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}
  .meter{height:3px;background:var(--line-soft);border-radius:2px;margin-top:12px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:2px;width:0;animation:fill .7s .1s
    cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes fill{to{width:var(--w)}}
  .srcs{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
  .src{display:inline-flex;align-items:center;gap:6px;background:var(--raise);
    border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11.5px;
    color:var(--dim);text-decoration:none;font-family:var(--mono);transition:all .15s}
  .src:hover{border-color:var(--accent);color:var(--ink)}
  .src i{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .cands{margin-top:12px;display:grid;gap:7px}
  .cand{display:flex;gap:12px;align-items:baseline;background:var(--raise);
    border:1px solid var(--line);border-radius:9px;padding:8px 11px}
  .cand b{color:var(--warn);font-family:var(--mono);font-size:11.5px;font-weight:500;
    min-width:92px}
  .cand span{font-size:14px}
  .dissent{margin-top:10px;font-size:12.5px;color:var(--warn);display:flex;gap:7px;
    align-items:baseline;background:var(--warn-bg);border-radius:8px;padding:7px 11px}
  .dissent b{font-family:var(--mono);font-weight:500;font-size:11.5px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:5px 18px;box-shadow:var(--shadow)}
  .prow{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:13px 0;
    border-bottom:1px solid var(--line-soft);align-items:start}
  .prow:last-child{border-bottom:0}
  .prow dt{color:var(--faint);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    font-weight:600;padding-top:2px}
  .prow dd{margin:0;font-size:14.5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--raise);border:1px solid var(--line);border-radius:7px;
    padding:4px 10px;font-size:12.5px;color:var(--dim);transition:all .15s}
  .chip:hover{border-color:var(--accent);color:var(--ink)}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .shots img{width:100%;height:108px;object-fit:cover;border-radius:11px;
    border:1px solid var(--line);cursor:zoom-in;transition:transform .22s,border-color .22s}
  .shots img:hover{transform:scale(1.03);border-color:var(--accent)}
  dialog{border:0;background:transparent;padding:0;max-width:92vw;max-height:92vh}
  dialog::backdrop{background:rgba(10,11,14,.86);backdrop-filter:blur(3px)}
  dialog img{max-width:92vw;max-height:92vh;border-radius:12px;display:block}

  /* Ratings sit apart from facts on purpose: they are not one number two
     sources argue about, so they get no badge and no confidence bar. */
  .rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}
  .rate{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;box-shadow:var(--shadow);text-decoration:none;display:block;
    transition:border-color .18s,transform .18s}
  .rate:hover{border-color:var(--accent);transform:translateY(-1px)}
  .rate .who{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);font-weight:600}
  .rate .n{font-size:27px;font-weight:680;letter-spacing:-.02em;line-height:1.25;
    display:flex;align-items:baseline;gap:7px}
  .rate .n s{text-decoration:none;font-size:13px;font-weight:400;color:var(--faint)}
  .stars{color:var(--warn);font-size:13px;letter-spacing:2px;margin-top:1px}
  .rate .thin{color:var(--faint);font-size:11.5px;margin-top:5px}

  .fact.operator_verified::before{background:var(--accent-2)}
  .operator_verified .badge{background:rgba(167,139,250,.14);color:var(--accent-2)}
  .byline{margin-top:10px;font-size:12.5px;color:var(--accent-2);
    background:rgba(167,139,250,.09);border-radius:8px;padding:8px 11px}
  .byline b{font-weight:600}
  .byline em{font-style:normal;color:var(--dim)}
  .was{margin-top:8px;font-size:12.5px;color:var(--faint)}
  .was s{opacity:.8}
  .confirm{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .confirm input{flex:1;min-width:150px;padding:8px 11px;font-size:13.5px;border-radius:9px}
  .mini{background:transparent;border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12.5px;padding:7px 13px;border-radius:9px;cursor:pointer;
    transition:all .15s}
  .mini:hover{border-color:var(--accent-2);color:var(--ink);background:rgba(167,139,250,.1)}
  .mini.primary{border-color:var(--accent-2);color:var(--accent-2)}

  .trail{display:grid;gap:0}
  .ev{display:grid;grid-template-columns:20px 1fr;gap:13px;padding:0 0 16px}
  .ev .rail{display:flex;flex-direction:column;align-items:center}
  .ev .pip{width:9px;height:9px;border-radius:50%;background:var(--accent-2);
    margin-top:5px;flex:0 0 auto}
  .ev .line{width:1px;flex:1;background:var(--line);margin-top:4px}
  .ev:last-child .line{display:none}
  .ev .what{font-size:14px}
  .ev .when{color:var(--faint);font-size:12px;margin-top:2px}
  .ev q{color:var(--dim);font-style:italic}
  .statusbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .statusbar .mini[aria-pressed=true]{border-color:var(--accent);color:var(--ink);
    background:rgba(122,162,247,.16)}

  .asks{display:grid;gap:9px}
  .ask{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:11px;padding:13px 16px;font-size:14.5px}
  .ask .q{color:var(--accent);font-weight:700;flex:0 0 auto}
  .notes{display:grid;gap:7px}
  .note{display:flex;gap:11px;color:var(--dim);font-size:13.5px;padding:10px 14px;
    background:var(--raise);border:1px solid var(--line-soft);border-radius:10px}
  .note .m{color:var(--faint);flex:0 0 auto}
  footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line-soft);
    color:var(--faint);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  footer .chip{font-family:var(--mono);font-size:11.5px}
</style>

<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>Workbench</h1>
    <p>research one business before you walk in</p>
  </div>
  <form id="f">
    <div class="field"><input id="q" placeholder="Company name or website — Hutchins BBQ, or craftwaykitchen.com" autofocus></div>
    <div class="field small"><input id="loc" placeholder="City, ST"></div>
    <div class="field small"><input id="notes" placeholder="What you know"></div>
    <button class="go" id="go">Research</button>
  </form>
  <div class="picks" id="picks"><b>TRY</b></div>
</header>

<main id="out"></main>
<dialog id="lightbox"><img id="lightbox-img" alt=""></dialog>

<script>
const EXAMPLES = [
  ["Hutchins BBQ", ""], ["craftwaykitchen.com", ""],
  ["Ryno Lawn Care", "Frisco, TX"], ["The Heritage Table", "Frisco, TX"],
  ["JS Lawn Care Service", "Frisco, TX"], ["Starbucks", "Frisco, TX"],
  ["Zzqqx Nonexistent Business", "Frisco, TX"],
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const EMPTY = `<div class="empty in">
  <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.5-4.5"/></svg>
  <h3>Nothing looked up yet</h3>
  <p>Give a company name or a website. Every claim comes back with the sources
     behind it, so you can see what is confirmed and what is only one source's word.</p></div>`;
$("#out").innerHTML = EMPTY;

const picks = $("#picks");
for (const [q, loc] of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pick"; b.textContent = q;
  b.setAttribute("aria-pressed", "false");
  b.onclick = () => {
    document.querySelectorAll(".pick").forEach(p => p.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    $("#q").value = q; $("#loc").value = loc; $("#f").requestSubmit();
  };
  picks.appendChild(b);
}

$("#f").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  $("#go").disabled = true;
  $("#out").innerHTML = `<div class="load in">
    <div class="step"><span class="spin"></span>Reading their website</div>
    <div class="step"><span class="spin"></span>Checking Google</div>
    <div class="step"><span class="spin"></span>Checking Yelp and OpenStreetMap</div>
    <div class="step"><span class="spin"></span>Corroborating what each source claims</div></div>`;
  try {
    const p = new URLSearchParams({q, location: $("#loc").value, notes: $("#notes").value});
    const data = await (await fetch("/api/brief?" + p)).json();
    LEAD = data.lead_id || null;
    $("#out").innerHTML = data.error
      ? `<div class="err in">${esc(data.error)}</div>` : render(data);
    window.scrollTo({top: 0, behavior: "smooth"});
  } catch (err) {
    $("#out").innerHTML = `<div class="err in">${esc(err.message)}</div>`;
  }
  $("#go").disabled = false;
};

const COLOR = {verified: "var(--ok)", unverified: "var(--warn)",
               conflict: "var(--bad)", operator_verified: "var(--accent-2)"};
const VERIFIABLE = ["address", "phone", "hours"];
let LEAD = null;   // the lead currently on screen

const when = iso => {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined,
    {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
};

// What you were told outranks any directory, so say plainly whose word it is.
function byline(f) {
  if (f.confidence !== "operator_verified") return "";
  return `<div class="byline"><b>${esc(f.verified_by)}</b> confirmed this ${when(f.verified_at)}`
    + (f.verified_note ? ` — <em>${esc(f.verified_note)}</em>` : "") + `</div>`
    + (f.superseded ? `<div class="was">sources said <s>${esc(f.superseded)}</s></div>` : "");
}

// Confirming is one line: the value you were given, and how you know.
function confirmRow(f) {
  if (!LEAD || !VERIFIABLE.includes(f.field)) return "";
  const start = f.confidence === "conflict" ? "" : esc(f.value ?? "");
  return `<div class="confirm">
    <input placeholder="what they actually told you" value="${start}"
           data-v="${esc(f.field)}" onkeydown="if(event.key==='Enter')confirmField('${esc(f.field)}')">
    <input placeholder="how do you know?" data-n="${esc(f.field)}"
           onkeydown="if(event.key==='Enter')confirmField('${esc(f.field)}')">
    <button class="mini primary" onclick="confirmField('${esc(f.field)}')">Confirm</button>
  </div>`;
}

async function post(path, body) {
  const res = await fetch(path, {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({lead_id: LEAD, ...body})});
  const data = await res.json();
  if (data.error) { alert(data.error); return null; }
  return data;
}

async function confirmField(field) {
  const value = document.querySelector(`[data-v="${field}"]`).value.trim();
  const note = document.querySelector(`[data-n="${field}"]`).value.trim();
  if (!value) { alert("Enter what they told you."); return; }
  const data = await post("/api/verify", {field, value, note});
  if (data) { $("#out").innerHTML = render(data); window.scrollTo({top: 0, behavior: "smooth"}); }
}

async function setStatus(status) {
  const data = await post("/api/status", {status});
  if (data) $("#out").innerHTML = render(data);
}

async function addNote() {
  const box = document.querySelector("#newnote");
  const text = box.value.trim();
  if (!text) return;
  const data = await post("/api/note", {note: text});
  if (data) $("#out").innerHTML = render(data);
}

function fact(f) {
  // A conflict has no single value: showing one would pick a winner the
  // evidence does not support, so name each source and what it claimed.
  const body = f.confidence === "conflict"
    ? `<div class="cands">${f.candidates.map(c =>
        `<div class="cand"><b>${esc(c.source_type)}</b><span>${esc(c.value)}</span></div>`).join("")}</div>`
    : `<div class="srcs">${f.sources.map(s => s.source_url
        ? `<a class="src" href="${esc(s.source_url)}" target="_blank" rel="noopener"><i></i>${esc(s.source_type)}</a>`
        : `<span class="src"><i></i>${esc(s.source_type)}</span>`).join("")}</div>`
      + (f.dissent || []).map(d =>
        `<div class="dissent"><b>${esc(d.source_type)}</b> disagrees — says ${esc(d.value)}</div>`).join("");
  return `<div class="fact ${f.confidence} in">
    <div class="fname">${esc(f.label)}</div>
    <div class="fval${f.confidence === "conflict" ? " disputed" : ""}">
      ${f.confidence === "conflict" ? "sources disagree" : esc(f.value)}
      <span class="badge">${f.confidence}</span>
      <span class="pct">${f.score}%</span>
    </div>
    <div class="meter"><i style="--w:${f.score}%;background:${COLOR[f.confidence]}"></i></div>
    ${byline(f)}${body}${confirmRow(f)}</div>`;
}

const chips = a => `<div class="chips">${a.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>`;
const prow = (term, html) => html ? `<div class="prow"><dt>${term}</dt><dd>${html}</dd></div>` : "";

function published(p) {
  if (!p) return "";
  const priced = p.menu_items.length
    ? `${p.menu_items.length} priced item${p.menu_items.length === 1 ? "" : "s"} — `
      + esc(p.menu_items.slice(0, 3).map(i => i.name + (i.price ? ` ${i.price}` : "")).join(" · "))
    : "";
  const rows = [
    prow("tagline", p.tagline ? esc(p.tagline) : ""),
    prow("services", p.services.length ? chips(p.services) : ""),
    prow("sells", p.products.length ? chips(p.products) : ""),
    prow("hours", p.hours.length ? p.hours.map(esc).join("<br>") : ""),
    prow("pricing", priced),
    prow("menu doc", p.menu_media.length ? chips(p.menu_media.map(m => m.kind)) : ""),
    prow("social", p.socials.length ? chips(p.socials.map(s => s.name)) : ""),
    prow("email", p.emails.length ? chips(p.emails) : ""),
  ].join("");
  const shots = p.photos.length ? `<section class="in">
    <h3 class="head">Photos on their site</h3>
    <div class="shots">${p.photos.map(u =>
      `<img src="${esc(u)}" loading="lazy" alt="" onerror="this.remove()"
            onclick="openShot(this.src)">`).join("")}</div></section>` : "";
  return (rows ? `<section class="in"><h3 class="head">What their site publishes</h3>
    <dl class="panel">${rows}</dl></section>` : "") + shots;
}

function openShot(src) {
  $("#lightbox-img").src = src;
  $("#lightbox").showModal();
}
$("#lightbox").onclick = () => $("#lightbox").close();

function render(d) {
  const site = d.website_url
    ? `<a href="${esc(d.website_url)}" target="_blank" rel="noopener">${esc(d.website_url)}</a>`
      + ({blocked: ` <span class="warnish">— blocked our reader; the site itself is probably fine</span>`,
          error: ` <span class="none">— returning an error</span>`,
          unreachable: ` <span class="none">— not loading</span>`}[d.site_status] || "")
    : `<span class="none">no website found</span>`;

  // The counts say at a glance how much of this you can rely on.
  const n = k => d.facts.filter(f => f.confidence === k).length;
  const scores = [["verified", n("verified"), "var(--ok)"],
                  ["1 source", n("unverified"), "var(--warn)"],
                  ["disputed", n("conflict"), "var(--bad)"]]
    .filter(([, v]) => v > 0)
    .map(([label, v, c]) => `<div class="score"><b style="color:${c}">${v}</b><span>${label}</span></div>`)
    .join("");

  const chain = d.chain_signals.length ? `<div class="banner in">
    <b>Multiple locations — a franchise is not a lead, but a local group may be a better one</b>
    <ul>${d.chain_signals.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : "";

  const facts = d.facts.length
    ? `<section class="in"><h3 class="head">What we established</h3>
       <div class="facts">${d.facts.map(fact).join("")}</div></section>`
    : `<section class="in"><h3 class="head">What we established</h3>
       <div class="empty" style="padding:32px"><h3>Nothing corroborated</h3>
       <p>No source we consulted carries this business. The questions below are
          the whole brief.</p></div></section>`;

  // Review count is the point: 4.8 from 106 people and 2.4 from 9 are not
  // remotely the same claim, and the count is what tells them apart.
  const ratings = (d.ratings || []).length ? `<section class="in">
    <h3 class="head">Ratings — each platform, its own crowd</h3>
    <div class="rates">${d.ratings.map(r => {
      const full = Math.round(r.value);
      const thin = r.reviews != null && r.reviews < 15;
      return `<a class="rate" href="${esc(r.source_url || "#")}" target="_blank" rel="noopener">
        <div class="who">${esc(r.source)}</div>
        <div class="n">${esc(r.value)}<s>/ 5</s></div>
        <div class="stars">${"★".repeat(full)}${"☆".repeat(Math.max(0, 5 - full))}</div>
        ${r.reviews != null ? `<div class="thin">${r.reviews} review${r.reviews === 1 ? "" : "s"}${
          thin ? " — too few to lean on" : ""}</div>` : ""}
      </a>`;
    }).join("")}</div></section>` : "";

  const STATUSES = ["new", "to visit", "visited", "interested", "not interested"];
  const statusbar = d.lead_id ? `<div class="statusbar">${
    STATUSES.map(t => `<button class="mini" aria-pressed="${d.status === t}"
      onclick="setStatus('${t}')">${t}</button>`).join("")}</div>` : "";

  // Read top to bottom, the trail explains every value on this page.
  const trail = (d.events || []).length ? `<section class="in">
    <h3 class="head">Trail — every change, and who made it</h3>
    <div class="trail">${d.events.map(e => {
      const what = e.kind === "status"
        ? `status → <b>${esc(e.new_value)}</b>`
        : e.kind === "note" ? `note`
        : `${esc(e.kind)} <b>${esc(e.field)}</b> as ${esc(e.new_value)}`
          + (e.old_value && e.old_value !== e.new_value
             ? ` <em style="color:var(--faint)">(was ${esc(e.old_value)})</em>` : "");
      return `<div class="ev"><div class="rail"><span class="pip"></span><span class="line"></span></div>
        <div><div class="what">${what}</div>
        ${e.note ? `<div class="what"><q>${esc(e.note)}</q></div>` : ""}
        <div class="when">${esc(e.actor)} · ${when(e.at)}</div></div></div>`;
    }).join("")}</div>
    <div class="confirm"><input id="newnote" placeholder="add a note — what you saw or were told"
      onkeydown="if(event.key==='Enter')addNote()">
      <button class="mini" onclick="addNote()">Add note</button></div></section>`
    : (d.lead_id ? `<section class="in"><h3 class="head">Trail</h3>
        <div class="confirm"><input id="newnote" placeholder="add a note — what you saw or were told"
          onkeydown="if(event.key==='Enter')addNote()">
          <button class="mini" onclick="addNote()">Add note</button></div></section>` : "");

  const asks = d.open_questions.length ? `<section class="in">
    <h3 class="head">Ask them</h3><div class="asks">${d.open_questions.map(q =>
      `<div class="ask"><span class="q">?</span><span>${esc(q)}</span></div>`).join("")}</div></section>` : "";

  const notes = d.assumptions.length ? `<section class="in">
    <h3 class="head">Assumptions — correct these if wrong</h3><div class="notes">${
      d.assumptions.map(a => `<div class="note"><span class="m">·</span><span>${esc(a)}</span></div>`).join("")
    }</div></section>` : "";

  return `<div class="hero in">
      <div>
        <h2>${esc(d.name)}</h2>
        <div class="meta">
          ${d.location ? `<span>${esc(d.location)}</span>` : ""}
          <span>${site}</span>
        </div>
      </div>
      ${scores ? `<div class="scorecard">${scores}</div>` : ""}
    </div>
    ${statusbar}${chain}${facts}${ratings}${published(d.published)}${asks}${notes}${trail}
    <footer><span>sources consulted</span>${
      (d.sources_consulted.length ? d.sources_consulted : ["none"])
        .map(s => `<span class="chip">${esc(s)}</span>`).join("")}</footer>`;
}
</script>
