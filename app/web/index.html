<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Field-ledger tokens: warm paper ground, slate ink, one confident teal
     accent for actions/automation, terracotta for human-confirmed data.
     Verified/unverified/conflict keep a muted (not neon) traffic-light —
     the whole point of this screen is scanning trust at a glance. */
  :root{
    /* Ochre and the muted grey were nudged a shade darker than the
       handoff: at #a8710f and #6e7379 they measured 3.8:1 and 4.4:1 on
       this paper ground, under the 4.5:1 needed for small text. Same
       hues, same intent, now legible. */
    --bg:#f7f5f0; --surface:#ffffff; --raise:#f1efe7; --line:#ddd7c9;
    --line-soft:#e9e5da;
    --ink:#1c2024;
    --dim:#4b5157;
    --faint:#6c7076;
    --accent:#0f6e5c;
    --accent-600:#0c5a4b;
    --accent-700:#09453a;
    --accent-2:#b5502e;
    --ok:#1f7a4d;
    --warn:#98660e;
    --bad:#b3392c;
    --ok-bg:#e8f1e9; --warn-bg:#f7ecda; --bad-bg:#f8e6e2; --accent-bg:#e3eeec; --accent2-bg:#f3e3da;
    --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:8px;
    --shadow:0 1px 2px rgba(28,32,36,.05),0 4px 10px -6px rgba(28,32,36,.12);
    --shadow-lift:0 2px 4px rgba(28,32,36,.08),0 10px 20px -10px rgba(28,32,36,.2);
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-600);text-decoration:underline}
  button:focus-visible,.pick:focus-visible,.mini:focus-visible,a:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}

  header{position:sticky;top:0;z-index:10;padding:22px 34px 18px;
    border-bottom:2px solid var(--line);
    background:var(--bg)}
  .brand{display:flex;align-items:baseline;gap:11px}
  .brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;font-family:var(--sans)}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);align-self:center}
  .brand p{margin:0;color:var(--faint);font-size:13px}
  form{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
  .field{position:relative;flex:1;min-width:230px}
  .field.small{flex:0 0 172px;min-width:140px}
  input{width:100%;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);padding:12px 15px;border-radius:6px;font:inherit;
    transition:border-color .18s,background .18s}
  input:hover{border-color:#b9b2a0}
  input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  input::placeholder{color:var(--faint)}
  button.go{background:var(--accent);
    border:0;color:#fff;padding:12px 26px;border-radius:6px;font:inherit;
    font-weight:700;cursor:pointer;transition:background .16s,opacity .18s}
  button.go:hover{background:var(--accent-600)}
  button.go:active{background:var(--accent-700)}
  button.go:disabled{opacity:.45;cursor:default}
  .picks{margin-top:11px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .picks b{color:var(--faint);font-weight:400;font-size:12px;letter-spacing:.03em}
  .pick{background:transparent;border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12.5px;padding:4px 11px;border-radius:6px;cursor:pointer;
    transition:all .16s}
  .pick:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  .pick[aria-pressed=true]{border-color:var(--accent);color:var(--accent);
    background:var(--accent-bg)}

  main{position:relative;z-index:1;padding:30px 34px 90px;max-width:1080px;margin:0 auto}
  .empty{text-align:center;padding:76px 20px;color:var(--faint)}
  .empty svg{opacity:.5;margin-bottom:14px}
  .empty h3{color:var(--dim);font-weight:600;margin:0 0 6px;font-size:16px}
  .empty p{margin:0;font-size:13.5px;max-width:400px;margin-inline:auto}
  .err{background:var(--bad-bg);border:1px solid color-mix(in srgb, var(--bad) 35%, transparent);
    color:var(--bad);padding:16px 18px;border-radius:var(--r)}

  /* Loading: the lookup takes seconds, so show what it is doing. */
  .load{padding:44px 4px;max-width:440px}
  .step{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:14px;
    padding:7px 0;opacity:.35;animation:step-in .4s ease forwards}
  .step:nth-child(1){animation-delay:.05s}.step:nth-child(2){animation-delay:1.1s}
  .step:nth-child(3){animation-delay:2.4s}.step:nth-child(4){animation-delay:4s}
  @keyframes step-in{to{opacity:1;color:var(--dim)}}
  .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  .in{animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  .hero{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;
    padding-bottom:22px;border-bottom:1px solid var(--line)}
  .hero h2{margin:0 0 7px;font-size:32px;font-weight:700;letter-spacing:-.02em;
    line-height:1.15}
  .hero .meta{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
  .hero .meta span{color:var(--dim)}
  .hero a{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:13px}
  .hero a:hover{text-decoration:underline}
  .none{color:var(--bad)}
  .warnish{color:var(--warn)}
  .scorecard{margin-left:auto;display:flex;gap:8px}
  .score{background:var(--raise);border:1px solid var(--line);border-radius:8px;
    padding:9px 14px;text-align:center;min-width:66px}
  .score b{display:block;font-size:21px;font-weight:700;line-height:1.2}
  .score span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

  .listing{margin:20px 0 0;padding:15px 17px;border-radius:var(--r);
    background:var(--bad-bg);border:1px solid color-mix(in srgb, var(--accent) 35%, transparent)}
  .listing.mild{background:var(--warn-bg);border-color:var(--line)}
  .listing.unknown{background:var(--raise);border-color:var(--line)}
  .listing b{display:block;font-size:13.5px;margin-bottom:7px;color:var(--bad)}
  .listing.mild b{color:var(--warn)} .listing.unknown b{color:var(--dim)}
  .listing .urls{display:grid;grid-template-columns:76px 1fr;gap:5px 12px;
    font-size:12.5px;font-family:var(--mono);align-items:baseline}
  .listing .urls span{color:var(--faint);font-family:var(--sans)}
  .listing .urls a{color:var(--accent);text-decoration:underline;word-break:break-all}
  .listing s{color:var(--faint)}
  .listing .fixit{margin-top:11px}

  .banner{margin:22px 0 0;padding:15px 17px;border-radius:var(--r);
    background:var(--warn-bg);border:1px solid var(--line)}
  .banner b{color:var(--warn);display:block;margin-bottom:6px;font-size:13.5px;font-weight:600}
  .banner ul{margin:0;padding-left:19px;color:var(--dim);font-size:13.5px}

  section{margin-top:34px}
  h3.head{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:10px}
  h3.head::after{content:'';flex:1;height:1px;background:var(--line-soft)}

  .facts{display:grid;gap:11px}
  .fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    transition:border-color .18s}
  .fact:hover{border-color:#c8c1af}
  .fact::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
  .fact.verified::before{background:var(--ok)}
  .fact.unverified::before{background:var(--warn)}
  .fact.conflict::before{background:var(--bad)}
  /* Field name first: you should know what you are reading before you judge it. */
  .fname{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin-bottom:5px}
  .fval{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35;
    display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .fval.disputed{color:var(--bad);font-size:16px}
  .badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
    padding:3px 8px;border-radius:4px;white-space:nowrap}
  .verified .badge{background:var(--ok-bg);color:var(--ok)}
  .unverified .badge{background:var(--warn-bg);color:var(--warn)}
  .conflict .badge{background:var(--bad-bg);color:var(--bad)}
  .pct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .meter{height:3px;background:var(--line-soft);border-radius:2px;margin-top:12px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:2px;width:0;animation:fill .7s .1s
    cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes fill{to{width:var(--w)}}
  .srcs{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
  .src{display:inline-flex;align-items:center;gap:6px;background:var(--raise);
    border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11.5px;
    color:var(--dim);text-decoration:none;font-family:var(--mono);transition:all .15s}
  .src:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  .src i{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .cands{margin-top:12px;display:grid;gap:7px}
  .cand{display:flex;gap:12px;align-items:baseline;background:var(--raise);
    border:1px solid var(--line);border-radius:6px;padding:8px 11px}
  .cand b{color:var(--warn);font-family:var(--mono);font-size:11.5px;font-weight:500;
    min-width:92px}
  .cand span{font-size:14px}
  .dissent{margin-top:10px;font-size:12.5px;color:var(--warn);display:flex;gap:7px;
    align-items:baseline;background:var(--warn-bg);border-radius:6px;padding:7px 11px}
  .dissent b{font-family:var(--mono);font-weight:500;font-size:11.5px}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:5px 18px;box-shadow:var(--shadow)}
  .prow{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:13px 0;
    border-bottom:1px solid var(--line);align-items:start}
  .prow:last-child{border-bottom:0}
  .prow dt{color:var(--faint);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    font-weight:600;padding-top:2px}
  .prow dd{margin:0;font-size:14.5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--raise);border:1px solid var(--line);border-radius:6px;
    padding:4px 10px;font-size:12.5px;color:var(--dim);transition:all .15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .shots img{width:100%;height:108px;object-fit:cover;border-radius:6px;
    border:1px solid var(--line);cursor:zoom-in;transition:border-color .22s}
  .shots img:hover{border-color:var(--accent)}
  dialog{border:0;background:transparent;padding:0;max-width:92vw;max-height:92vh}
  dialog::backdrop{background:color-mix(in srgb, var(--ink) 55%, transparent)}
  dialog img{max-width:92vw;max-height:92vh;border-radius:8px;display:block}

  /* Ratings sit apart from facts on purpose: they are not one number two
     sources argue about, so they get no badge and no confidence bar. */
  .rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}
  .rate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;box-shadow:var(--shadow);text-decoration:none;display:block;
    transition:border-color .18s,box-shadow .18s,transform .18s}
  .rate:hover{border-color:var(--accent);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
  .rate .who{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);font-weight:700}
  .rate .n{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.25;
    display:flex;align-items:baseline;gap:7px}
  .rate .n s{text-decoration:none;font-size:13px;font-weight:400;color:var(--faint)}
  .stars{color:var(--warn);font-size:13px;letter-spacing:2px;margin-top:1px}
  .rate .thin{color:var(--faint);font-size:11.5px;margin-top:5px}

  .fact.operator_verified::before{background:var(--accent-2)}
  .operator_verified .badge{background:var(--accent2-bg);color:var(--accent-2)}
  .byline{margin-top:10px;font-size:12.5px;color:var(--accent-2);
    background:var(--accent2-bg);border-radius:6px;padding:8px 11px}
  .byline b{font-weight:600}
  .byline em{font-style:normal;color:var(--dim)}
  .was{margin-top:8px;font-size:12.5px;color:var(--faint)}
  .was s{opacity:.8}
  .confirm{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .confirm input{flex:1;min-width:150px;padding:8px 11px;font-size:13.5px;border-radius:6px}
  .mini{background:transparent;border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12.5px;padding:7px 13px;border-radius:6px;cursor:pointer;
    transition:all .15s}
  .mini:hover{border-color:var(--accent-2);color:var(--accent-2);background:var(--accent2-bg)}
  .mini.primary{border-color:var(--accent-2);color:var(--accent-2)}

  .trail{display:grid;gap:0}
  .ev{display:grid;grid-template-columns:20px 1fr;gap:13px;padding:0 0 16px}
  .ev .rail{display:flex;flex-direction:column;align-items:center}
  .ev .pip{width:8px;height:8px;border-radius:50%;background:var(--accent-2);
    margin-top:5px;flex:0 0 auto}
  .ev .line{width:1px;flex:1;background:var(--line);margin-top:4px}
  .ev:last-child .line{display:none}
  .ev .what{font-size:14px}
  .ev .when{color:var(--faint);font-size:12px;margin-top:2px}
  .ev q{color:var(--dim);font-style:italic}
  .statusbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .statusbar .mini[aria-pressed=true]{border-color:var(--accent);color:var(--accent);
    background:var(--accent-bg)}

  .where{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:13px;
    font-size:13.5px;color:var(--dim)}
  .where b{color:var(--ink);font-weight:600}
  .group{margin-top:34px}
  .ghead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .ghead h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
  .ghead span{color:var(--faint);font-size:13px}
  .gcount{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px;
    margin-top:13px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;
    font:inherit;color:inherit;display:flex;flex-direction:column;gap:9px;
    transition:border-color .18s,box-shadow .18s,transform .18s;
    animation:rise .38s cubic-bezier(.2,.7,.3,1) both}
  .card:hover{border-color:var(--accent);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
  .card:active{transform:translateY(0)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ctop{display:flex;gap:12px;align-items:flex-start}
  .cname{font-weight:800;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
  .cmeta{color:var(--faint);font-size:12.5px;margin-top:3px}
  /* The one-line case for walking in. Everything else on the card supports it. */
  .pitch{font-size:13.5px;line-height:1.45;color:var(--ink);font-weight:600;
    background:var(--accent-bg);border-radius:6px;padding:9px 11px;border-left:3px solid var(--accent)}
  .pitch.cold{background:var(--raise);color:var(--dim);font-weight:400}
  .also{display:flex;flex-direction:column;gap:3px}
  .also div{font-size:12.5px;color:var(--dim);display:flex;gap:7px;align-items:baseline}
  .also i{color:var(--accent);font-style:normal;flex:0 0 auto}
  /* The score is the first thing you look at, so it is the only ring on the page. */
  .ring{--p:0;flex:0 0 auto;width:46px;height:46px;border-radius:8px;display:grid;
    place-items:center;font-weight:700;font-size:14px;position:relative;overflow:hidden;
    background:var(--raise);border:1px solid var(--line)}
  .ring::after{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*1%);
    background:var(--ring-c);opacity:.16;z-index:0}
  .ring b{position:relative;z-index:1;color:var(--ring-c)}
  .why{display:flex;flex-direction:column;gap:4px}
  .why div{font-size:12.5px;color:var(--dim);display:flex;gap:7px;align-items:baseline}
  .why i{font-family:var(--mono);font-style:normal;font-size:11px;flex:0 0 30px;
    text-align:right;font-variant-numeric:tabular-nums}
  .why .up{color:var(--ok)} .why .down{color:var(--bad)} .why .flat{color:var(--faint)}
  .cfoot{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:4px;
    font-size:12px;color:var(--faint);font-family:var(--mono)}
  .tag{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:2px 7px;
    font-family:var(--sans);font-size:11.5px;font-weight:700}
  .tag.ok{background:var(--ok-bg);color:var(--ok)}
  .skel{height:118px;border-radius:var(--r);background:linear-gradient(100deg,
    var(--raise) 30%,var(--bg) 48%,var(--raise) 62%);background-size:220% 100%;
    animation:shimmer 1.3s linear infinite}
  @keyframes shimmer{to{background-position:-120% 0}}
  .back{background:none;border:0;color:var(--accent);font:inherit;font-size:13.5px;
    cursor:pointer;padding:0;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
  .back:hover{text-decoration:underline}

  .tabs{display:flex;gap:2px;background:var(--raise);border:1px solid var(--line);
    border-radius:8px;padding:2px}
  .tab{background:none;border:0;font:inherit;font-size:13px;font-weight:600;
    color:var(--dim);padding:6px 14px;border-radius:6px;cursor:pointer;
    transition:background .16s,color .16s}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected=true]{background:var(--surface);color:var(--ink);
    box-shadow:var(--shadow)}
  .tab .n{color:var(--faint);font-weight:500;margin-left:5px}
  /* A lead you have worked is not the same object as a name off a search, so
     the row carries what you last did to it rather than a score. */
  .lead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:13px 15px;cursor:pointer;font:inherit;color:inherit;text-align:left;
    width:100%;transition:border-color .16s,box-shadow .16s}
  .lead:hover{border-color:var(--accent);box-shadow:var(--shadow-lift)}
  .lead h4{margin:0;font-size:15px;font-weight:640}
  .lead .sub{color:var(--faint);font-size:12.5px;margin-top:3px;font-family:var(--mono)}
  .lead .last{color:var(--dim);font-size:12.5px;margin-top:4px}
  .pipe{display:grid;gap:8px}
  .pipe > .mini{justify-self:start;margin-bottom:6px}
  .stage{margin-top:22px}
  .stage h3{margin:0 0 9px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);font-weight:700;display:flex;align-items:center;gap:9px}
  .stage h3 em{font-style:normal;color:var(--dim);font-family:var(--mono);
    font-size:11.5px;letter-spacing:0}
  .saved{background:var(--accent-bg);color:var(--accent);border-radius:5px;
    padding:2px 7px;font-size:11px;font-weight:700;letter-spacing:.02em}

  .build{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px;box-shadow:var(--shadow)}
  .build textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:11px 13px;font:inherit;font-size:14px;
    resize:vertical;min-height:62px}
  .build textarea:focus{outline:2px solid var(--accent);outline-offset:1px;
    border-color:var(--accent)}
  .build .row{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .hint{color:var(--faint);font-size:12.5px}
  .read{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .read span{font-size:11.5px;border-radius:5px;padding:3px 9px}
  .read .got{background:var(--ok-bg);color:var(--ok)}
  .read .no{background:var(--warn-bg);color:var(--warn)}
  .read .skip{background:var(--raise);color:var(--faint)}
  .frame{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;background:var(--surface)}
  .frame .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;
    border-bottom:1px solid var(--line);font-size:12px;color:var(--faint);
    font-family:var(--mono)}
  .frame .bar a{margin-left:auto;color:var(--accent);text-decoration:none;
    font-family:var(--sans);font-weight:600}
  .frame iframe{width:100%;height:520px;border:0;display:block;background:#fff}
  .vers{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .ver{background:var(--raise);border:1px solid var(--line);border-radius:6px;
    padding:4px 10px;font-size:12px;cursor:pointer;font:inherit;color:var(--dim)}
  .ver:hover{border-color:var(--accent);color:var(--accent)}
  .ver[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);
    color:var(--accent);font-weight:600}

  /* ---------------------------------------------------- the workspace --- */
  /* Three panes: what happened, what it looks like, what was understood.
     Built from the same tokens as the rest of the dashboard so it reads as one
     product rather than a bolted-on screen. */
  body.workspace-open{overflow:hidden}
  .workspace{position:fixed;inset:0;z-index:60;background:var(--bg);
    display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,1.5fr) minmax(270px,.95fr);
    grid-template-rows:auto 1fr}
  .ws-top{grid-column:1/-1;display:flex;align-items:center;gap:14px;
    padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
  .ws-top h2{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
  .ws-top .sub{color:var(--faint);font-size:12.5px;font-family:var(--mono)}
  .ws-top .close{margin-left:auto}
  .ws-pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .ws-pane+.ws-pane{border-left:1px solid var(--line)}
  .ws-head{padding:12px 16px 9px;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--faint);font-weight:700;
    border-bottom:1px solid var(--line-soft)}
  .ws-body{flex:1;overflow-y:auto;padding:14px 16px}

  /* left: the trail, newest first, with the chat pinned under it */
  .ws-event{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:0 0 13px;
    cursor:default}
  .ws-event.pick{cursor:pointer;border-radius:8px;margin:0 -8px 13px;padding:6px 8px 13px}
  .ws-event.pick:hover{background:var(--raise)}
  .ws-event.active{background:var(--accent-bg);margin:0 -8px 13px;padding:6px 8px 13px;
    border-radius:8px}
  .ws-event .rail{display:flex;flex-direction:column;align-items:center}
  .ws-event .pip{width:8px;height:8px;border-radius:50%;background:var(--line);
    margin-top:5px;flex:0 0 auto}
  .ws-event.site .pip{background:var(--accent)}
  .ws-event.rejected .pip{background:var(--bad)}
  .ws-event .line{width:1px;flex:1;background:var(--line);margin-top:4px}
  .ws-event:last-child .line{display:none}
  .ws-event .what{font-size:13.5px;line-height:1.45}
  .ws-event .who{color:var(--faint);font-size:11.5px;margin-top:3px;
    font-family:var(--mono)}
  .ws-event q{color:var(--dim);font-style:italic}
  .chatbox{border-top:1px solid var(--line);padding:12px 14px;background:var(--surface)}
  .chatbox textarea{width:100%;min-height:60px;resize:vertical;border-radius:9px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);
    font:inherit;font-size:13.5px;padding:10px 12px}
  .chatbox textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .chatbox .row{display:flex;align-items:center;gap:9px;margin-top:9px}
  .basis{color:var(--faint);font-size:11.5px;font-family:var(--mono)}
  .basis b{color:var(--accent)}

  /* centre: the preview, at phone width by default */
  .ws-stage{flex:1;display:grid;place-items:center;padding:20px;overflow:auto;
    background:repeating-linear-gradient(45deg,var(--raise) 0 10px,transparent 10px 20px)}
  .device{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow-lift);overflow:hidden;transition:width .3s ease}
  .device iframe{display:block;border:0;width:100%;height:100%;background:#fff}
  .device.phone{width:390px;height:750px;max-height:calc(100vh - 190px)}
  .device.wide{width:100%;height:calc(100vh - 190px);border-radius:10px}
  .ws-toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;
    border-bottom:1px solid var(--line-soft)}
  .ws-toolbar .grow{margin-left:auto}

  /* right: what the instruction was understood to mean */
  .diag{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .diag span{font-size:11.5px;border-radius:6px;padding:4px 9px;line-height:1.35}
  .diag .got{background:var(--ok-bg);color:var(--ok)}
  .diag .skip{background:var(--raise);color:var(--faint)}
  .diag .no{background:var(--warn-bg);color:var(--warn)}
  .diag .stop{background:var(--bad-bg);color:var(--bad);font-weight:600}
  .diag-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);font-weight:700;margin:0 0 7px}
  .vchip{background:var(--raise);border:1px solid var(--line);border-radius:6px;
    padding:4px 10px;font-size:12px;cursor:pointer;font:inherit;color:var(--dim);
    font-family:var(--mono)}
  .vchip:hover{border-color:var(--accent);color:var(--accent)}
  .vchip[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);
    color:var(--accent);font-weight:700}
  .said{background:var(--raise);border-left:2px solid var(--accent);
    border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;color:var(--dim);
    font-style:italic;margin-bottom:14px}
  /* The preview must never be the pane that loses. Three panes plus a header
     do not fit in one viewport height once they stack, and the middle one
     collapsed to a single pixel — a blank screen where the site should be. */
  .ws-stage{min-height:420px}
  @media (max-width:1100px){
    /* Stop pretending it is one screen: let the whole thing scroll. */
    body.workspace-open{overflow:auto}
    .workspace{position:absolute;inset:0 0 auto;min-height:100vh;
      grid-template-columns:1fr;grid-template-rows:auto}
    .ws-pane{min-height:0;overflow:visible}
    .ws-pane+.ws-pane{border-left:0;border-top:1px solid var(--line)}
    .ws-body{overflow:visible;max-height:none}
    .ws-stage{min-height:min(760px,88vh)}
    .device.phone{max-height:none}
    .ws-top{position:sticky;top:0;z-index:2}
    .chatbox{position:sticky;bottom:0}
  }

  /* Labelling: the one thing a person can do that the machine cannot. */
  .shots-grid{display:grid;gap:9px;margin-top:10px}
  .shot-card{display:grid;grid-template-columns:76px 1fr;gap:10px;
    border:1px solid var(--line);border-radius:9px;padding:8px;
    background:var(--surface);align-items:center}
  .shot-card img{width:76px;height:60px;object-fit:cover;border-radius:6px;
    display:block}
  .shot-card input{width:100%;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;
    padding:6px 8px}
  .shot-card input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .shot-card .tagrow{display:flex;align-items:center;gap:7px;margin-top:5px}
  .shot-card .tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    font-weight:700;color:var(--faint)}
  .shot-card select{border:1px solid var(--line);border-radius:5px;
    background:var(--bg);color:var(--dim);font:inherit;font-size:11px;
    padding:2px 5px}
  .shot-card.labelled{border-color:var(--accent)}
  .shot-card.labelled .tag{color:var(--accent)}
  .planout{font-family:var(--mono);font-size:11.5px;line-height:1.75;
    white-space:pre-wrap;background:var(--raise);border:1px solid var(--line);
    border-radius:8px;padding:11px 13px;color:var(--dim);margin:0 0 14px}

  .asks{display:grid;gap:9px}
  .ask{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:6px;padding:13px 16px;font-size:14.5px}
  .ask .q{color:var(--accent);font-weight:700;flex:0 0 auto}
  .notes{display:grid;gap:7px}
  .note{display:flex;gap:11px;color:var(--dim);font-size:13.5px;padding:10px 14px;
    background:var(--raise);border:1px solid var(--line);border-radius:6px}
  .note .m{color:var(--faint);flex:0 0 auto}
  footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--faint);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  footer .chip{font-family:var(--mono);font-size:11.5px}
</style>

<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>Workbench</h1>
    <p>research one business before you walk in</p>
  </div>
  <form id="f">
    <div class="field"><input id="q" placeholder="Company name or website — Hutchins BBQ, or craftwaykitchen.com" autofocus></div>
    <div class="field small"><input id="loc" placeholder="City, ST"></div>
    <div class="field small"><input id="notes" placeholder="What you know"></div>
    <button class="go" id="go">Research</button>
  </form>
  <div class="where" id="where">
    <div class="tabs">
      <button class="tab" id="tab-prospects" aria-selected="true"
        onclick="showTab('prospects')">Prospects</button>
      <button class="tab" id="tab-leads" aria-selected="false"
        onclick="showTab('leads')">My leads <span class="n" id="leadcount"></span></button>
    </div>
    <span id="near">near</span> <b id="place">…</b>
    <button class="pick" onclick="askLocation()">Use my location</button>
    <button class="pick" onclick="changePlace()">Change</button>
    <button class="pick" onclick="loadLanding(true)">Refresh</button>
  </div>
</header>

<main id="out"></main>
<dialog id="lightbox"><img id="lightbox-img" alt=""></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------------------------------------------------------------- landing ---
// The list of prospects is the product; search is for when you already know
// who you are looking at.
let PLACE = null;   // {latitude, longitude, label}

// A brief is a detour from the list, so there is always a way back to it.
const BACK = `<button class="back" onclick="loadLanding()">← back to prospects</button>`;

const EMPTY = `<div class="empty in">
  <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.5-4.5"/></svg>
  <h3>Nowhere to look yet</h3>
  <p>Allow location, or pick a town, and this fills with local businesses ranked
     by how much they look like they need a website.</p></div>`;

const CATEGORIES = [
  ["restaurants", "Restaurants & cafés"], ["hvac", "HVAC & plumbing"],
  ["home", "Home services"], ["auto", "Auto services"],
  ["beauty", "Salons & spas"], ["fitness", "Gyms & studios"],
  ["pro", "Local professionals"], ["shops", "Independent shops"],
];

function savePlace(place) {
  PLACE = place;
  $("#place").textContent = place.label;
  try { localStorage.setItem("workbench.place", JSON.stringify(place)); } catch {}
}

function askLocation() {
  if (!navigator.geolocation) { changePlace(); return; }
  $("#place").textContent = "asking your browser…";
  navigator.geolocation.getCurrentPosition(
    pos => { savePlace({latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude, label: "your location"});
             loadLanding(); },
    () => { $("#place").textContent = "location declined"; changePlace(); },
    {timeout: 8000});
}

async function changePlace() {
  const typed = prompt("Which town? e.g. Frisco, TX");
  if (!typed) return;
  $("#place").textContent = "finding " + typed + "…";
  const found = await (await fetch("/api/where?q=" + encodeURIComponent(typed))).json();
  if (found.error) { $("#place").textContent = found.error; return; }
  savePlace(found);
  loadLanding();
}

const STAGES = ["to visit", "visited", "interested", "new", "not interested"];
let SAVED = {};     // lower-cased name -> saved lead, so the list can mark its own

async function refreshSaved() {
  try {
    const data = await (await fetch("/api/leads")).json();
    SAVED = {};
    for (const lead of data.leads || []) SAVED[lead.name.toLowerCase()] = lead;
    const working = (data.leads || []).filter(l => l.status !== "new").length;
    $("#leadcount").textContent = (data.leads || []).length
      ? `${working || (data.leads || []).length}` : "";
    return data.leads || [];
  } catch { return []; }
}

function showTab(which) {
  $("#tab-prospects").setAttribute("aria-selected", which === "prospects");
  $("#tab-leads").setAttribute("aria-selected", which === "leads");
  // The location controls belong to the prospect search, not to saved leads.
  for (const id of ["near", "place"]) $("#" + id).style.display =
    which === "prospects" ? "" : "none";
  document.querySelectorAll("#where .pick").forEach(b =>
    b.style.display = which === "prospects" ? "" : "none");
  if (which === "leads") renderLeads(); else loadLanding();
}

// Grouped by where each one stands, because the question this screen answers
// is "who am I going to see today", not "what have I looked up".
async function renderLeads() {
  const leads = await refreshSaved();
  if (!leads.length) {
    $("#out").innerHTML = `<div class="empty in"><h3>No leads saved yet</h3>
      <p>Open a business from the prospect list and it is saved here, with
         whatever you confirm or note about it.</p></div>`;
    return;
  }
  const stages = STAGES.filter(st => leads.some(l => l.status === st));
  $("#out").innerHTML = stages.map(stage => {
    const rows = leads.filter(l => l.status === stage);
    return `<section class="stage in"><h3>${esc(stage)} <em>${rows.length}</em></h3>
      <div class="pipe">${rows.map(leadRow).join("")}</div></section>`;
  }).join("");
}

function leadRow(l) {
  const touched = l.last_action_at
    ? `${esc(l.last_action || "opened")} · ${when(l.last_action_at)}`
    : "not touched since it was saved";
  return `<button class="lead" onclick="openLead(${l.id})">
    <div><h4>${esc(l.name)}</h4>
      <div class="sub">${esc(l.website_url || "no website")}</div>
      <div class="last">${touched}</div></div>
    <div class="saved">${l.event_count} ${l.event_count === 1 ? "note" : "notes"}</div>
  </button>
  <button class="mini" style="margin-top:-4px"
    onclick="openWorkspace(${l.id}, ${esc(JSON.stringify(l.name))})">Open workspace →</button>`;
}

async function openLead(id) {
  $("#out").innerHTML = `<div class="load in"><div class="step">
    <span class="spin"></span>Opening what we already know</div></div>`;
  let data;
  try {
    data = await (await fetch("/api/lead?id=" + id)).json();
  } catch (err) {
    $("#out").innerHTML = `<div class="err in">Could not open that lead: ${
      esc(err.message)}</div>`;
    return;
  }
  if (data.error) { $("#out").innerHTML = `<div class="err in">${esc(data.error)}</div>`; return; }
  LEAD = data.lead_id || id;
  SITE = null;
  try {
    data.site_versions =
      ((await (await fetch("/api/sites?id=" + id)).json()).versions) || [];
  } catch { data.site_versions = []; }
  paint(data);
}

const ringColor = n => n >= 80 ? "var(--ok)" : n >= 60 ? "var(--warn)" : "var(--faint)";

function card(p) {
  // Show the reasons that moved the score most — the case, not the arithmetic.
  // Ordered by how much each moved the score, not by the order the rules ran:
  // "no website" is the reason to walk in, "+6 a phone number" is not.
  const why = [...(p.reasons || [])]
    .sort((a, b) => Math.abs(parseInt(b)) - Math.abs(parseInt(a)))
    .slice(0, 3).map(r => {
    const points = r.trim().split(/\s+/)[0];
    const cls = points.startsWith("+") ? "up" : points === "0" ? "flat" : "down";
    return `<div><i class="${cls}">${esc(points)}</i><span>${
      esc(r.trim().slice(points.length).trim())}</span></div>`;
  }).join("");
  const site = p.website
    ? `<span class="tag ok">has a site</span>` : `<span class="tag">no website</span>`;
  // A business you have already worked should not read as a fresh name.
  const seen = SAVED[(p.name || "").toLowerCase()];
  const mark = seen && seen.status !== "new"
    ? `<span class="saved">${esc(seen.status)}</span>` : "";
  const cold = /Nothing obviously wrong|already works/.test(p.headline || "");
  const pitch = `<div class="pitch${cold ? " cold" : ""}">${esc(p.headline || "")}</div>`;
  const also = (p.taglines || []).slice(1, 3).map(t =>
    `<div><i>›</i><span>${esc(t)}</span></div>`).join("");
  return `<button class="card" onclick="openProspect(${esc(JSON.stringify(p.name))
    .replace(/'/g, "&#39;")}, ${esc(JSON.stringify(p.address || ""))})">
    <div class="ctop">
      <div class="ring" style="--p:${p.score};--ring-c:${ringColor(p.score)}"><b>${p.score}</b></div>
      <div><div class="cname">${esc(p.name)}</div>
        <div class="cmeta">${p.rating != null ? `${p.rating}★ · ${p.reviews} reviews` : "no rating yet"}</div>
      </div>
    </div>
    ${pitch}
    ${also ? `<div class="also">${also}</div>` : ""}
    <details onclick="event.stopPropagation()"><summary class="cmeta"
      style="cursor:pointer">how this score was built</summary>
      <div class="why" style="margin-top:7px">${why}</div></details>
    <div class="cfoot">${site}${mark}</div></button>`;
}

function openProspect(name, address) {
  $("#q").value = name;
  $("#loc").value = (address || "").split(",").slice(1, 3).join(",").trim();
  $("#f").requestSubmit();
}

async function loadLanding(refresh = false) {
  if (!PLACE) return;
  refreshSaved();
  $("#out").innerHTML = CATEGORIES.map(([key, label]) => `<section class="group" id="g-${key}">
      <div class="ghead"><h3>${esc(label)}</h3></div>
      <div class="cards"><div class="skel"></div><div class="skel"></div>
        <div class="skel"></div><div class="skel"></div></div></section>`).join("");
  // Each category is its own request so the page fills in as answers arrive
  // instead of waiting half a minute for the slowest one.
  CATEGORIES.forEach(async ([key]) => {
    const q = new URLSearchParams({lat: PLACE.latitude, lng: PLACE.longitude,
                                   category: key, refresh: refresh ? "1" : "0"});
    let group;
    try {
      const data = await (await fetch("/api/prospects?" + q)).json();
      group = data.error ? {error: data.error} : (data.groups || [])[0];
    } catch (err) { group = {error: err.message}; }
    const node = document.getElementById("g-" + key);
    if (!node) return;
    if (group.error) {
      node.innerHTML = `<div class="ghead"><h3>${esc(node.querySelector("h3").textContent)}</h3></div>
        <div class="err">${esc(group.error)}</div>`;
      return;
    }
    const list = group.prospects || [];
    node.innerHTML = `<div class="ghead"><h3>${esc(group.label)}</h3>
        <span>${esc(group.blurb || "")}</span>
        <span class="gcount">${list.length}</span></div>
      <div class="cards">${list.slice(0, 8).map(card).join("")}</div>`;
  });
}

(function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("workbench.place") || "null"); } catch {}
  if (saved && saved.latitude) { savePlace(saved); loadLanding(); }
  else { $("#place").textContent = "nowhere yet"; $("#out").innerHTML = EMPTY; askLocation(); }
})();

$("#f").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  $("#go").disabled = true;
  $("#out").innerHTML = `<div class="load in">
    <div class="step"><span class="spin"></span>Reading their website</div>
    <div class="step"><span class="spin"></span>Checking Google</div>
    <div class="step"><span class="spin"></span>Checking Yelp and OpenStreetMap</div>
    <div class="step"><span class="spin"></span>Corroborating what each source claims</div></div>`;
  try {
    const p = new URLSearchParams({q, location: $("#loc").value, notes: $("#notes").value});
    const data = await (await fetch("/api/brief?" + p)).json();
    LEAD = data.lead_id || null;
    SITE = null;
    if (LEAD) {
      try { data.site_versions =
        (await (await fetch("/api/sites?id=" + LEAD)).json()).versions || []; } catch {}
    }
    if (data.error) $("#out").innerHTML = `<div class="err in">${esc(data.error)}</div>`;
    else paint(data);
    window.scrollTo({top: 0, behavior: "smooth"});
  } catch (err) {
    $("#out").innerHTML = `<div class="err in">${esc(err.message)}</div>`;
  }
  $("#go").disabled = false;
};

// Rendering is the one place a thrown exception is invisible: the loading
// message simply stays forever. Say what broke instead.
function paint(data) {
  try {
    $("#out").innerHTML = render(data);
  } catch (err) {
    $("#out").innerHTML = `<div class="err in">The brief could not be drawn: ${
      esc(err.message)}. The data is fine — this is a bug in the page.</div>`;
    throw err;
  }
}

const COLOR = {verified: "var(--ok)", unverified: "var(--warn)",
               conflict: "var(--bad)", operator_verified: "var(--accent-2)"};
const VERIFIABLE = ["address", "phone", "hours", "website"];
let LEAD = null;   // the lead currently on screen

const when = iso => {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined,
    {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
};

// What you were told outranks any directory, so say plainly whose word it is.
function byline(f) {
  if (f.confidence !== "operator_verified") return "";
  return `<div class="byline"><b>${esc(f.verified_by)}</b> confirmed this ${when(f.verified_at)}`
    + (f.verified_note ? ` — <em>${esc(f.verified_note)}</em>` : "") + `</div>`
    + (f.superseded ? `<div class="was">sources said <s>${esc(f.superseded)}</s></div>` : "");
}

// Confirming is one line: the value you were given, and how you know.
function confirmRow(f) {
  if (!LEAD || !VERIFIABLE.includes(f.field)) return "";
  const start = f.confidence === "conflict" ? "" : esc(f.value ?? "");
  return `<div class="confirm">
    <input placeholder="what they actually told you" value="${start}"
           data-v="${esc(f.field)}" onkeydown="if(event.key==='Enter')confirmField('${esc(f.field)}')">
    <input placeholder="how do you know?" data-n="${esc(f.field)}"
           onkeydown="if(event.key==='Enter')confirmField('${esc(f.field)}')">
    <button class="mini primary" onclick="confirmField('${esc(f.field)}')">Confirm</button>
  </div>`;
}

async function post(path, body) {
  const res = await fetch(path, {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({lead_id: LEAD, ...body})});
  const data = await res.json();
  if (data.error) { alert(data.error); return null; }
  refreshSaved();                 // a status change must show in the tab count
  return data;
}

async function confirmField(field) {
  const value = document.querySelector(`[data-v="${field}"]`).value.trim();
  const note = document.querySelector(`[data-n="${field}"]`).value.trim();
  if (!value) { alert("Enter what they told you."); return; }
  const data = await post("/api/verify", {field, value, note});
  if (data) { $("#out").innerHTML = render(data); window.scrollTo({top: 0, behavior: "smooth"}); }
}

// One click writes the correction into the trail, attributed like any other.
async function correctWebsite(url) {
  const data = await post("/api/verify", {field: "website", value: url,
    note: "corrected from the address on their Google listing"});
  if (data) { LEAD = data.lead_id || LEAD; $("#out").innerHTML = render(data); }
}

// The brief's own site panel. Deliberately thin: iterating happens in the
// workspace, and a second chat box on this screen would be two places to do
// the same thing with two different sets of state.
function buildPanel(d) {
  if (!LEAD) return "";
  const versions = d.site_versions || [];
  const latest = versions[0];
  const preview = latest ? `<div class="frame">
      <div class="bar">v${latest.version} — built from what they publish
        <a href="/site/${LEAD}/${latest.version}" target="_blank" rel="noopener"
          >open full size ↗</a></div>
      <iframe src="/site/${LEAD}/${latest.version}" title="Generated site preview"
        sandbox="allow-scripts"></iframe></div>` : "";
  return `<section class="in"><h3 class="head">Their new site</h3>
    <div class="build">
      <div class="row">
        <button class="mini primary"
          onclick="openWorkspace(LEAD, ${esc(JSON.stringify(d.name || ""))})">
          ${versions.length ? "Open the workspace" : "Build the first version"}</button>
        <span class="hint">${versions.length
          ? `${versions.length} version${versions.length === 1 ? "" : "s"} so far — `
          : ""}describe what you want and iterate there.</span>
      </div>
      ${preview}
    </div></section>`;
}

// -------------------------------------------------------------- workspace ---
// Three panes: what happened to this lead, what the site looks like now, and
// what the last instruction was actually understood to mean.
let WS = null;   // {lead_id, name, versions, events, active, diagnostics}

async function openWorkspace(leadId, name) {
  const data = await (await fetch("/api/workspace?id=" + leadId)).json();
  let shots = {photos: [], options: []};
  try { shots = await (await fetch("/api/photos?id=" + leadId)).json(); } catch {}
  // Every POST helper sends the global LEAD, so opening the workspace has to
  // set it — otherwise labelling and status changes post without a lead id and
  // fail silently behind an alert.
  LEAD = leadId;
  WS = {lead_id: leadId, name: name || `Lead ${leadId}`,
        versions: data.versions || [], events: data.events || [],
        active: (data.versions || [])[0]?.version ?? null,
        diagnostics: null, device: "phone", outline: data.outline || "",
        photos: shots.photos || [], labelOptions: shots.options || []};
  document.body.classList.add("workspace-open");
  drawWorkspace();
}

function closeWorkspace() {
  WS = null;
  document.body.classList.remove("workspace-open");
  const frame = $("#workspace");
  if (frame) frame.remove();
  renderLeads();
}

// The version a new instruction will branch from. Selecting an older version
// in the trail sets this, which is what makes the history navigable rather
// than merely readable.
function activeVersion() { return WS && WS.active; }

function pickVersion(version) {
  WS.active = version;
  const row = WS.versions.find(v => v.version === version);
  WS.diagnostics = row ? {understood: row.notes?.understood || [],
                          ignored_tokens: row.notes?.ignored || [],
                          unmet: row.notes?.unmet || [],
                          contradictions: row.notes?.contradictions || [],
                          spec: row.spec, version} : null;
  drawWorkspace();
}

function eventLine(e) {
  if (e.kind === "site") {
    const version = parseInt(String(e.new_value || "").replace("v", ""), 10);
    const from = e.old_value ? ` from ${esc(e.old_value)}` : "";
    return {cls: "site pick", version,
            what: `built <b>${esc(e.new_value)}</b>${from}`};
  }
  if (e.kind === "site_rejected") {
    return {cls: "rejected", version: null,
            what: `<b>blocked</b> — ${esc(e.new_value)}`};
  }
  if (e.kind === "status") return {cls: "", version: null,
    what: `status → <b>${esc(e.new_value)}</b>`};
  if (e.kind === "note") return {cls: "", version: null, what: "note"};
  return {cls: "", version: null,
          what: `${esc(e.kind)} <b>${esc(e.field || "")}</b> ${esc(e.new_value || "")}`};
}

function drawWorkspace() {
  const trail = WS.events.length ? WS.events.map(e => {
    const line = eventLine(e);
    const active = line.version && line.version === WS.active;
    return `<div class="ws-event ${line.cls}${active ? " active" : ""}"
      ${line.version ? `onclick="pickVersion(${line.version})"` : ""}>
      <div class="rail"><span class="pip"></span><span class="line"></span></div>
      <div><div class="what">${line.what}</div>
        ${e.note ? `<div class="what"><q>${esc(e.note)}</q></div>` : ""}
        <div class="who">${esc(e.actor)} · ${when(e.at)}</div></div></div>`;
  }).join("") : `<p class="hint">Nothing built yet. Describe the site below.</p>`;

  const chips = WS.versions.map(v =>
    `<button class="vchip" aria-pressed="${v.version === WS.active}"
      onclick="pickVersion(${v.version})"
      title="${esc(v.spec || "no instructions")}">v${v.version}${
        v.parent_version ? `←${v.parent_version}` : ""}</button>`).join("");

  // What the site was decided to be, before it was emitted. Reading this is a
  // different and much cheaper activity than reading a rendered page.
  const outline = WS.outline
    ? `<p class="diag-label">The plan</p><pre class="planout">${esc(WS.outline)}</pre>`
    : "";
  const untagged = (WS.photos || []).filter(p => !p.label).length;
  const labeller = (WS.photos || []).length ? `
    <p class="diag-label">What each photo shows</p>
    <p class="hint">Describe them in your own words — that becomes the alt text,
       and the tag is read out of it. Leave any you cannot identify blank:
       untagged photos still appear in the gallery, they just never lead.</p>
    <div class="row" style="margin:8px 0 4px;gap:8px">
      <button class="mini primary" onclick="saveDescriptions()">Save all</button>
      <button class="mini" onclick="prefillDescriptions()">Fill from filenames</button>
      <span class="basis">${untagged} of ${WS.photos.length} untagged</span>
    </div>
    <div class="shots-grid">${WS.photos.map((p, i) => `
      <div class="shot-card${p.label ? " labelled" : ""}">
        <img src="${esc(p.url)}" alt="" loading="lazy">
        <div>
          <input value="${esc(p.description || "")}" data-photo="${i}"
            placeholder="${esc(p.suggestion || "e.g. brisket plate with slaw")}"
            onkeydown="if(event.key==='Enter')saveDescriptions()">
          <div class="tagrow"><span class="tag">${esc(p.label || "untagged")}</span>
            <select data-tag="${i}">
              <option value="">read from the words</option>
              ${(WS.labelOptions || []).map(o =>
                `<option value="${esc(o)}"${p.label === o ? " selected" : ""}>${esc(o)}</option>`
              ).join("")}
            </select>
          </div>
        </div></div>`).join("")}</div>` : "";

  const d = WS.diagnostics;
  const diag = d ? `
    ${d.spec ? `<div class="said">“${esc(d.spec)}”</div>` : ""}
    ${d.blocked ? `<p class="diag-label">Blocked by the content gate</p>
      <div class="diag">${(d.findings || []).map(f =>
        `<span class="stop">${esc(f)}</span>`).join("")}</div>
      <p class="hint">Nothing was saved. The previous version is still live.</p>` : ""}
    ${(d.understood || []).length ? `<p class="diag-label">Understood</p>
      <div class="diag">${d.understood.map(x =>
        `<span class="got">${esc(x)}</span>`).join("")}</div>` : ""}
    ${(d.ignored_tokens || []).length ? `<p class="diag-label">Ignored — not understood</p>
      <div class="diag">${d.ignored_tokens.map(x =>
        `<span class="skip">${esc(x)}</span>`).join("")}</div>` : ""}
    ${(d.unmet || []).length ? `<p class="diag-label">Could not be done</p>
      <div class="diag">${d.unmet.map(x =>
        `<span class="no">${esc(x)}</span>`).join("")}</div>` : ""}
    ${(d.contradictions || []).length ? `<p class="diag-label">Conflicting</p>
      <div class="diag">${d.contradictions.map(x =>
        `<span class="no">${esc(x)}</span>`).join("")}</div>` : ""}
    ` : `<p class="hint">Send an instruction and what it was understood to mean
         will appear here.</p>`;

  const src = WS.active ? `/site/${WS.lead_id}/${WS.active}` : "";
  const html = `<div class="workspace" id="workspace">
    <div class="ws-top">
      <h2>${esc(WS.name)}</h2>
      <span class="sub">${WS.active ? "v" + WS.active : "no version yet"}</span>
      <button class="mini close" onclick="closeWorkspace()">← back to leads</button>
    </div>

    <section class="ws-pane">
      <div class="ws-head">History</div>
      <div class="ws-body" id="ws-trail">${trail}</div>
      <form class="chatbox" onsubmit="event.preventDefault();sendInstruction()">
        <textarea id="ws-input" placeholder="warm and rustic, lead with the gallery, book a table"
          onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey))sendInstruction()"></textarea>
        <div class="row">
          <button class="mini primary" type="submit">Send</button>
          <span class="basis">${WS.active
            ? `builds on <b>v${WS.active}</b>` : "first build"} · ⌘↵</span>
        </div>
      </form>
    </section>

    <section class="ws-pane">
      <div class="ws-toolbar">
        <button class="vchip" aria-pressed="${WS.device === "phone"}"
          onclick="setDevice('phone')">Phone</button>
        <button class="vchip" aria-pressed="${WS.device === "wide"}"
          onclick="setDevice('wide')">Desktop</button>
        <span class="grow"></span>
        ${src ? `<a class="vchip" href="${src}" target="_blank" rel="noopener"
          >open ↗</a>` : ""}
      </div>
      <div class="ws-stage">
        ${src ? `<div class="device ${WS.device}"><iframe src="${src}"
            title="Site preview" sandbox="allow-scripts"></iframe></div>`
          : `<div class="empty"><h3>No site yet</h3>
             <p>Describe what you want and it will appear here.</p></div>`}
      </div>
    </section>

    <section class="ws-pane">
      <div class="ws-head">Versions</div>
      <div class="ws-body">
        <div class="diag">${chips}</div>
        ${outline}${diag}${labeller}
      </div>
    </section>
  </div>`;

  const existing = $("#workspace");
  if (existing) existing.outerHTML = html;
  else document.body.insertAdjacentHTML("beforeend", html);
}

function setDevice(kind) { WS.device = kind; drawWorkspace(); }

// One instruction becomes one version. Deleted by a bulk edit and unnoticed
// because a missing handler fails silently: the form submits, nothing throws
// anywhere visible, and the page simply sits there.
async function sendInstruction() {
  const box = $("#ws-input");
  const sentence = (box.value || "").trim();
  if (!sentence) return;
  const button = document.querySelector(".chatbox .mini");
  const say = (text) => { if (button) button.textContent = text; };
  if (button) button.disabled = true;
  say("Building…");

  let data;
  try {
    const res = await fetch("/api/iterate", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({lead_id: WS.lead_id, sentence,
                            parent_version: activeVersion()})});
    data = await res.json();
  } catch (err) {
    // A build that dies server-side must say so. Silence here is what made
    // this bug invisible in the first place.
    alert("The build failed to run: " + err);
    return;
  } finally {
    if (button) button.disabled = false;
    say("Send");
  }
  if (data.error) { alert(data.error); return; }

  WS.versions = data.versions || WS.versions;
  WS.events = data.events || WS.events;
  // A rejected instruction writes no version, so the preview must stay on the
  // one that is still live rather than jumping to nothing.
  if (!data.rejected && data.version) WS.active = data.version;
  WS.outline = data.outline || WS.outline;
  WS.diagnostics = {understood: data.understood, ignored_tokens: data.ignored_tokens,
                    unmet: data.unmet, contradictions: data.contradictions,
                    blocked: data.rejected, findings: data.findings,
                    spec: sentence, version: data.version};
  box.value = "";
  drawWorkspace();
  if (!data.rejected) box.focus();
}

// A label is a fact about the picture, not about this build, so it is stored
// against the lead and every later version uses it.
// The description is the fact; the tag is read out of it and only overridden
// when the reading is wrong. Both are stored against the lead, so every later
// build uses them — and the words become alt text, which every generated image
// had been shipping empty.
// Saved together rather than one at a time: labelling twenty photographs
// should not be twenty round trips and twenty redraws of the whole pane.
async function saveDescriptions() {
  const entries = [];
  WS.photos.forEach((photo, index) => {
    const field = document.querySelector(`[data-photo="${index}"]`);
    const tag = document.querySelector(`[data-tag="${index}"]`);
    const description = field ? field.value.trim() : "";
    const override = tag ? tag.value : "";
    // Nothing said and nothing chosen means "I could not identify this one",
    // which is a legitimate answer and not something to send.
    if (!description && !override) return;
    entries.push({url: photo.url, description, label: override || null});
  });
  if (!entries.length) return;

  const button = document.querySelector(".shots-grid") &&
    document.querySelector(".diag-label + .hint + .row .mini");
  if (button) { button.disabled = true; button.textContent = "Saving…"; }
  const data = await post("/api/labels", {photos: entries});
  if (!data) { if (button) { button.disabled = false; button.textContent = "Save all"; } return; }
  WS.photos = WS.photos.map(photo => {
    const said = data.photos[photo.url];
    return said ? {...photo, description: said.description, label: said.label}
                : photo;
  });
  drawWorkspace();
}

// Their own uploads are often named after what they show. Google's photos have
// opaque URLs and get nothing, which is the honest answer rather than a guess.
function prefillDescriptions() {
  let filled = 0;
  WS.photos.forEach((photo, index) => {
    const field = document.querySelector(`[data-photo="${index}"]`);
    if (field && !field.value.trim() && photo.suggestion) {
      field.value = photo.suggestion;
      filled += 1;
    }
  });
  if (!filled) alert("None of the remaining filenames say what the photo shows.");
}

async function setStatus(status) {
  const data = await post("/api/status", {status});
  if (data) $("#out").innerHTML = render(data);
}

async function addNote() {
  const box = document.querySelector("#newnote");
  const text = box.value.trim();
  if (!text) return;
  const data = await post("/api/note", {note: text});
  if (data) $("#out").innerHTML = render(data);
}

function fact(f) {
  // A conflict has no single value: showing one would pick a winner the
  // evidence does not support, so name each source and what it claimed.
  const body = f.confidence === "conflict"
    ? `<div class="cands">${f.candidates.map(c =>
        `<div class="cand"><b>${esc(c.source_type)}</b><span>${esc(c.value)}</span></div>`).join("")}</div>`
    : `<div class="srcs">${f.sources.map(s => s.source_url
        ? `<a class="src" href="${esc(s.source_url)}" target="_blank" rel="noopener"><i></i>${esc(s.source_type)}</a>`
        : `<span class="src"><i></i>${esc(s.source_type)}</span>`).join("")}</div>`
      + (f.dissent || []).map(d =>
        `<div class="dissent"><b>${esc(d.source_type)}</b> disagrees — says ${esc(d.value)}</div>`).join("");
  return `<div class="fact ${f.confidence} in">
    <div class="fname">${esc(f.label)}</div>
    <div class="fval${f.confidence === "conflict" ? " disputed" : ""}">
      ${f.confidence === "conflict" ? "sources disagree" : esc(f.value)}
      <span class="badge">${f.confidence}</span>
      <span class="pct">${f.score}%</span>
    </div>
    <div class="meter"><i style="--w:${f.score}%;background:${COLOR[f.confidence]}"></i></div>
    ${byline(f)}${body}${confirmRow(f)}</div>`;
}

const chips = a => `<div class="chips">${a.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>`;
const prow = (term, html) => html ? `<div class="prow"><dt>${term}</dt><dd>${html}</dd></div>` : "";

function published(p) {
  if (!p) return "";
  const priced = p.menu_items.length
    ? `${p.menu_items.length} priced item${p.menu_items.length === 1 ? "" : "s"} — `
      + esc(p.menu_items.slice(0, 3).map(i => i.name + (i.price ? ` ${i.price}` : "")).join(" · "))
    : "";
  const rows = [
    prow("tagline", p.tagline ? esc(p.tagline) : ""),
    prow("services", p.services.length ? chips(p.services) : ""),
    prow("sells", p.products.length ? chips(p.products) : ""),
    prow("hours", p.hours.length ? p.hours.map(esc).join("<br>") : ""),
    prow("pricing", priced),
    prow("menu doc", p.menu_media.length ? chips(p.menu_media.map(m => m.kind)) : ""),
    prow("social", p.socials.length ? chips(p.socials.map(s => s.name)) : ""),
    prow("email", p.emails.length ? chips(p.emails) : ""),
  ].join("");
  const shots = p.photos.length ? `<section class="in">
    <h3 class="head">Photos on their site</h3>
    <div class="shots">${p.photos.map(u =>
      `<img src="${esc(u)}" loading="lazy" alt="" onerror="this.remove()"
            onclick="openShot(this.src)">`).join("")}</div></section>` : "";
  return (rows ? `<section class="in"><h3 class="head">What their site publishes</h3>
    <dl class="panel">${rows}</dl></section>` : "") + shots;
}

function openShot(src) {
  $("#lightbox-img").src = src;
  $("#lightbox").showModal();
}
$("#lightbox").onclick = () => $("#lightbox").close();

function render(d) {
  const site = d.website_url
    ? `<a href="${esc(d.website_url)}" target="_blank" rel="noopener">${esc(d.website_url)}</a>`
      + ({insecure: ` <span class="none">— certificate error: visitors get a security warning at this address</span>`,
          blocked: ` <span class="warnish">— blocked our reader; the site itself is probably fine</span>`,
          error: ` <span class="none">— returning an error</span>`,
          unreachable: ` <span class="none">— not loading</span>`}[d.site_status] || "")
    : `<span class="none">no website found</span>`;

  // The counts say at a glance how much of this you can rely on.
  const n = k => d.facts.filter(f => f.confidence === k).length;
  const scores = [["verified", n("verified"), "var(--ok)"],
                  ["1 source", n("unverified"), "var(--warn)"],
                  ["disputed", n("conflict"), "var(--bad)"]]
    .filter(([, v]) => v > 0)
    .map(([label, v, c]) => `<div class="score"><b style="color:${c}">${v}</b><span>${label}</span></div>`)
    .join("");

  // The address a directory publishes is not always the address that works,
  // and the difference is usually the reason to walk in — so it gets said
  // plainly, with the correction next to it.
  const u = d.url_check;
  const listing = u ? `<div class="listing in ${
      u.blocked ? "unknown" : ["http-link", "redirected"].includes(u.fault) ? "mild" : ""}">
    <b>${u.blocked ? "We could not check their site"
         : "The link on their Google listing is broken"}</b>
    <div class="urls">
      <span>published</span><a href="${esc(u.published)}" target="_blank"
        rel="noopener">${esc(u.published)}</a>
      ${u.working && u.working !== u.published
        ? `<span>works</span><a href="${esc(u.working)}" target="_blank"
             rel="noopener">${esc(u.working)}</a>` : ""}
    </div>
    <div style="margin-top:9px;font-size:13px;color:var(--dim)">${esc(u.note)}</div>
    ${u.working && u.working !== u.published && LEAD ? `<div class="fixit">
      <button class="mini primary" onclick="correctWebsite(${
        esc(JSON.stringify(u.working))})">Record ${esc(u.working)} as the right one</button>
      </div>` : ""}
  </div>` : "";

  const chain = d.chain_signals.length ? `<div class="banner in">
    <b>Multiple locations — a franchise is not a lead, but a local group may be a better one</b>
    <ul>${d.chain_signals.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : "";

  const facts = d.facts.length
    ? `<section class="in"><h3 class="head">What we established</h3>
       <div class="facts">${d.facts.map(fact).join("")}</div></section>`
    : `<section class="in"><h3 class="head">What we established</h3>
       <div class="empty" style="padding:32px"><h3>Nothing corroborated</h3>
       <p>No source we consulted carries this business. The questions below are
          the whole brief.</p></div></section>`;

  // Review count is the point: 4.8 from 106 people and 2.4 from 9 are not
  // remotely the same claim, and the count is what tells them apart.
  const ratings = (d.ratings || []).length ? `<section class="in">
    <h3 class="head">Ratings — each platform, its own crowd</h3>
    <div class="rates">${d.ratings.map(r => {
      const full = Math.round(r.value);
      const thin = r.reviews != null && r.reviews < 15;
      return `<a class="rate" href="${esc(r.source_url || "#")}" target="_blank" rel="noopener">
        <div class="who">${esc(r.source)}</div>
        <div class="n">${esc(r.value)}<s>/ 5</s></div>
        <div class="stars">${"★".repeat(full)}${"☆".repeat(Math.max(0, 5 - full))}</div>
        ${r.reviews != null ? `<div class="thin">${r.reviews} review${r.reviews === 1 ? "" : "s"}${
          thin ? " — too few to lean on" : ""}</div>` : ""}
      </a>`;
    }).join("")}</div></section>` : "";

  const STATUSES = ["new", "to visit", "visited", "interested", "not interested"];
  const statusbar = d.lead_id ? `<div class="statusbar">${
    STATUSES.map(t => `<button class="mini" aria-pressed="${d.status === t}"
      onclick="setStatus('${t}')">${t}</button>`).join("")}</div>` : "";

  // Read top to bottom, the trail explains every value on this page.
  const trail = (d.events || []).length ? `<section class="in">
    <h3 class="head">Trail — every change, and who made it</h3>
    <div class="trail">${d.events.map(e => {
      const what = e.kind === "status"
        ? `status → <b>${esc(e.new_value)}</b>`
        : e.kind === "note" ? `note`
        : `${esc(e.kind)} <b>${esc(e.field)}</b> as ${esc(e.new_value)}`
          + (e.old_value && e.old_value !== e.new_value
             ? ` <em style="color:var(--faint)">(was ${esc(e.old_value)})</em>` : "");
      return `<div class="ev"><div class="rail"><span class="pip"></span><span class="line"></span></div>
        <div><div class="what">${what}</div>
        ${e.note ? `<div class="what"><q>${esc(e.note)}</q></div>` : ""}
        <div class="when">${esc(e.actor)} · ${when(e.at)}</div></div></div>`;
    }).join("")}</div>
    <div class="confirm"><input id="newnote" placeholder="add a note — what you saw or were told"
      onkeydown="if(event.key==='Enter')addNote()">
      <button class="mini" onclick="addNote()">Add note</button></div></section>`
    : (d.lead_id ? `<section class="in"><h3 class="head">Trail</h3>
        <div class="confirm"><input id="newnote" placeholder="add a note — what you saw or were told"
          onkeydown="if(event.key==='Enter')addNote()">
          <button class="mini" onclick="addNote()">Add note</button></div></section>` : "");

  const asks = d.open_questions.length ? `<section class="in">
    <h3 class="head">Ask them</h3><div class="asks">${d.open_questions.map(q =>
      `<div class="ask"><span class="q">?</span><span>${esc(q)}</span></div>`).join("")}</div></section>` : "";

  const notes = d.assumptions.length ? `<section class="in">
    <h3 class="head">Assumptions — correct these if wrong</h3><div class="notes">${
      d.assumptions.map(a => `<div class="note"><span class="m">·</span><span>${esc(a)}</span></div>`).join("")
    }</div></section>` : "";

  return `${BACK}<div class="hero in">
      <div>
        <h2>${esc(d.name)}</h2>
        <div class="meta">
          ${d.location ? `<span>${esc(d.location)}</span>` : ""}
          <span>${site}</span>
        </div>
      </div>
      ${scores ? `<div class="scorecard">${scores}</div>` : ""}
    </div>
    ${statusbar}${listing}${chain}${facts}${ratings}${published(d.published)}
    ${buildPanel(d)}${asks}${notes}${trail}
    <footer><span>sources consulted</span>${
      (d.sources_consulted.length ? d.sources_consulted : ["none"])
        .map(s => `<span class="chip">${esc(s)}</span>`).join("")}</footer>`;
}
</script>
