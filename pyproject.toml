[project]
name = "local-web-outreach"
version = "0.1.0"
description = "Fully-audited, human-approved local-business website outreach platform (Phase 1: data & audit spine)"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast, no external dependencies (SQLite in-memory/temp).",
    "functional: end-to-end spine flow, may use SQLite and/or Postgres.",
    "performance: throughput/latency benchmarks (slower).",
    "postgres: requires a reachable PostgreSQL server (skipped otherwise).",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
